default_install_hook_types: [pre-commit, commit-msg, post-commit]
repos:
-   repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate commit format
        entry: python .githooks/validate-commit-msg.py
        language: python
        stages: [commit-msg]

      - id: compile-commands
        name: Generate compile_commands.json
        entry: xmake project -k compile_commands --outputdir=build
        language: system
        pass_filenames: false
        always_run: true
        stages: [ pre-commit ]

      #- id: clang-tidy
      #  name: clang-tidy
      #  entry: clang-tidy
      #  language: system
      #  args: [ "-p=build" ]
      #  types: [ c++ ]
      #  stages: [ pre-commit ]

      - id: Tests
        name: run tests
        entry: python .githooks/run-tests.py
        language: python
        stages: [ pre-commit ]

      - id: bench-results
        name: Add bench result
        entry: python .githooks/add_bench.py
        language: python
        stages: [ post-commit ]