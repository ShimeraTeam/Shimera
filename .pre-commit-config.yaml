default_install_hook_types: [pre-commit, commit-msg]
repos:
-   repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate commit format
        entry: .githooks/validate-commit-msg.sh
        language: script
        stages: [commit-msg]
-   repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy
        language: system
        args: [ "-p=build" ]
        types: [ c++ ]
        stages: [manual]
