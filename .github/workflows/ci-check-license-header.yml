name: CI - Check license headers
on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs: 
    build-Check-License-Headers:
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - uses: actions/setup-python@v7
          with:
            python-version: '3.x'
        - name: Check license headers
          run: git ls-files -z | xargs -0 python .githooks/check-license-headers.py
