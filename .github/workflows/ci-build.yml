name: CI - Build Windows & Linux
on:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
    build-Static-Shimera:
      strategy:
        fail-fast: false
        matrix:
          platform: [ubuntu-latest, windows-latest]
          backend: [glfw, sfml, raylib, sdl]

      runs-on: ${{ matrix.platform }}
      name: Build Shimera
      steps:
        - uses: actions/checkout@v7

        - name: Install system dependencies
          if: runner.os == 'Linux'
          run: |
            sudo apt-get update
            sudo apt-get install -y \
            build-essential cmake pkg-config \
            xutils-dev autoconf automake libtool gperf \
            libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
            libxss-dev libxext-dev libxfixes-dev libudev-dev \
            libgl1-mesa-dev libglu1-mesa-dev libpng-dev libfreetype6-dev \
            libxkbcommon-dev libxcb1-dev libxcb-image0-dev libxcb-keysyms1-dev \
            libxcb-shm0-dev libxcb-randr0-dev

        - name: Setup xmake
          uses: xmake-io/github-action-setup-xmake@v1
          with:
            xmake-version: latest
            actions-cache-folder: ".xmake-cache"

        - name: Build
          run: xmake build -y shimera-${{ matrix.backend }}
        
        - name: Build test example
          run: xmake build -y ${{ matrix.backend }}_example
