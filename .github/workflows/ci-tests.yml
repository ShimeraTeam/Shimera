name: CI - Tests Linux

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - feat/231-cicd-pipeline

jobs:
  run-shimera-tests:
    runs-on: self-hosted
    name: Run Tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set xmake path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Set permissions
        run: chmod +x run-tests.sh

      - name: Run
        run: ./run-tests.sh
        env:
          DISPLAY: :0
