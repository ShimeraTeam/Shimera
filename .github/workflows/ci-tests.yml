name: CI - Tests Linux

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev
      - feat/231-cicd-pipeline

jobs:
  run-shimera-tests:
    runs-on: self-hosted
    name: Run Tests
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential cmake pkg-config \
          xutils-dev autoconf automake libtool gperf \
          libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
          libxss-dev libxext-dev libxfixes-dev libudev-dev \
          libgl1-mesa-dev libglu1-mesa-dev libpng-dev libfreetype6-dev \
          libxkbcommon-dev libxcb1-dev libxcb-image0-dev libxcb-keysyms1-dev \
          libxcb-shm0-dev libxcb-randr0-dev

      - name: Set xmake path
        run: echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Install slangc
        env:
          SLANG_VERSION: "2026.21"
        run: |
          slang_dir="$HOME/.local/slang-$SLANG_VERSION"
          if [ ! -x "$slang_dir/bin/slangc" ]; then
            archive="$(mktemp)"
            curl -fsSL --retry 3 -o "$archive" \
              "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-linux-x86_64-glibc-2.27.tar.gz"
            rm -rf "$slang_dir.tmp"
            mkdir -p "$slang_dir.tmp"
            tar -xzf "$archive" -C "$slang_dir.tmp"
            rm -f "$archive"
            mv "$slang_dir.tmp" "$slang_dir"
          fi
          "$slang_dir/bin/slangc" -v
          echo "$slang_dir/bin" >> "$GITHUB_PATH"

      - name: Set permissions
        run: chmod +x run-tests.sh

      - name: Run
        run: ./run-tests.sh
        env:
          DISPLAY: :0
