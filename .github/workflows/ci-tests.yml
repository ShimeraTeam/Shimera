name: CI - Tests Linux & Windows

permissions:
  contents: write

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - dev

jobs:
  run-shimera-tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            slang-asset: linux-x86_64-glibc-2.27
          - platform: windows-latest
            slang-asset: windows-x86_64

    runs-on: ${{ matrix.platform }}
    name: Run Tests (${{ matrix.platform }})
    timeout-minutes: 60
    env:
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
          build-essential cmake pkg-config \
          xutils-dev autoconf automake libtool gperf \
          libx11-dev libxrandr-dev libxi-dev libxinerama-dev libxcursor-dev \
          libxss-dev libxext-dev libxfixes-dev libudev-dev \
          libgl1-mesa-dev libglu1-mesa-dev libpng-dev libfreetype6-dev \
          libxkbcommon-dev libxcb1-dev libxcb-image0-dev libxcb-keysyms1-dev \
          libxcb-shm0-dev libxcb-randr0-dev \
          xvfb libgl1-mesa-dri

      - name: Install Mesa
        if: runner.os == 'Windows'
        uses: ssciwr/setup-mesa-dist-win@v3

      - name: Setup xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: latest
          actions-cache-folder: ".xmake-cache"

      - name: Install slangc
        shell: bash
        env:
          SLANG_VERSION: "2026.21"
        run: |
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v$SLANG_VERSION/slang-$SLANG_VERSION-${{ matrix.slang-asset }}.tar.gz"
          mkdir slang
          tar -xzf slang.tar.gz -C slang
          slang/bin/slangc -v
          echo "$RUNNER_TEMP/slang/bin" >> "$GITHUB_PATH"

      - name: Run Linux
        if: runner.os == 'Linux'
        run: |
          chmod +x run-tests.sh
          xvfb-run -a -s "-screen 0 1280x720x24" ./run-tests.sh

      - name: Run Windows
        if: runner.os == 'Windows'
        run: .\run-tests.bat
